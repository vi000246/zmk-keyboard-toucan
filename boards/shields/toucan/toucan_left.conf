CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y


# ─────────────────────────────────────────────────────────────────────────
# 左半 = split central（2026-09-01 起）。以下是這個角色帶來的設定。
# 角色本身在 Kconfig.defconfig 的 SHIELD_TOUCAN_LEFT 區塊。
# ─────────────────────────────────────────────────────────────────────────

# Prospector status advertisement：把電量 / 層名 / modifier / WPM 塞進 BLE
# advertisement 對空氣廣播。dongle 上刷 t-ogura 的 scanner 韌體就能被動收聽
# 並顯示——它「不連線、不配對」，所以不佔鍵盤的 BT profile，關掉或拿走都
# 不影響鍵盤。模組來源見 config/west.yml 的 prospector-zmk-module。
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Toucan"

# 模組預設假設 central 在右邊，我們相反。錯了只是螢幕左右欄對調。
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

# 「連線完整」的定義：central + 1 個 peripheral（右半）。沒連滿時模組會改用
# burst/silent 循環讓出無線電，優先保證 central 連上右半。
# ⚠️ 這個符號 v2.2.1 才出現。模組已降回 v2.0.0（原因見 config/west.yml），
#    v2.0.0 沒有它，留著會噴 unmet-dependency 警告，所以註解掉；升回 v2.2.x
#    時要一起打開。
# CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=1

# 打字時 100 ms 更新一次、閒置時 30 秒一次——跟原廠 prospector-scanner 分支
# 同值。100 而不是 1000 是有原因的：zmk2 加的 HJKL SCRL flag 層是拿螢幕顯示的
# 層名當狀態指示燈用，1000 ms 會讓那個指示燈慢一整秒。因為是 activity-based，
# 閒置時的耗電不受影響。
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# 觸控板的處理鏈跑在 input thread 上，而這條鏈會呼叫 behavior
# (&zip_button_behaviors -> click macro)。Zephyr 預設 512 bytes，ZMK 只對
# peripheral 提高到 1024（zmk/app/src/pointing/Kconfig 的
# `default 1024 if ZMK_SPLIT && !ZMK_SPLIT_ROLE_CENTRAL`）。左半現在是
# central，會掉回 512 並在第一次點擊時讓 input thread 爆掉——2026-08-09
# 在 dongle 上發生過一模一樣的事。config/toucan.conf 也有設一份，這裡再寫
# 一次是因為這個值跟「誰是 central」直接綁在一起。
CONFIG_INPUT_THREAD_STACK_SIZE=2048
