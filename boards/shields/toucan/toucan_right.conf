CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# ── 觸控板：Azoteq TPS43（2026-09-03 從 Cirque Pinnacle 換過來）──────────
#
# 這台是 toucan2，感測器掛 I2C0 @0x74，不是 toucan1 的 SPI Cirque。
# 硬體差異與腳位對撞表見 config/west.yml；節點定義在 toucan_right.overlay。
# 驅動來自 beekeeb/zmk_driver_azoteq。
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

# 感測器的事件在 input thread 上處理，而這條鏈會呼叫 behavior
# （&zip_button_behaviors -> pad_tap_* macro）。Zephyr 預設 512 bytes 不夠，
# 原廠 toucan2 兩半都設 2048。
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_ZMK_BATTERY_REPORTING=y
# 這兩個是 central 才有作用，右半是 peripheral。
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# 深睡前的閒置時間。**本檔設的是 20 分鐘**（1200000 ms）。
# ZMK 預設 15 分鐘；上游註解建議 60 分鐘（理由是不用一直重連藍牙），那一行
# 以註解形式留在 toucan_left.conf。20 分鐘是本 repo 的折中值。
# ⚠️ 2026-09-18 更正：這裡原本寫「60 分鐘」，跟實際值不符。
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# 一般的 ZMK idle（預設 30 秒）。
# ⚠️ 2026-09-18 更正：原本寫「對觸控板耗電幫助很大」，**在 TPS43 上不成立**。
# 那句是 Cirque 時代上游的說法（舊驅動會在 ZMK IDLE 就讓感測器睡）。
# 現在的驅動只有設了 `idle-sleep` 才會在 ZMK IDLE 動觸控板，而我們刻意沒設
# （見 toucan_right.overlay）⇒ ZMK IDLE 對觸控板耗電與喚醒延遲**完全沒有影響**。
# 觸控板的省電是感測器自己的 ACTIVE/IDLE/LP1 狀態機在管，也在那個檔裡。
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ZMK_PM / PM_DEVICE / PM_DEVICE_SUSPEND_RESUME 都由這個帶進來，讓 sleep 狀態
# 能正確通知到觸控板驅動（TPS43 的 enable-power-management 需要）。
CONFIG_ZMK_PM_SOFT_OFF=y
