CONFIG_ZMK_MOUSE=y

# 這裡以前還有 11 行 CONFIG_DONGLE_SCREEN_*（dongle 螢幕的亮度、方向、待機
# 時間）。dongle 退出建置之後它們變成死設定：dongle_screen shield 沒被啟用，
# 這些符號的相依條件不成立，Kconfig 每次 build 都會噴一輪
# "attempt to assign to symbol with unmet dependencies" 警告然後忽略它們。
# 要找回舊值就看 prospector-dongle 分支的同一個檔案。


# The input thread runs the pointer's input-processor chain, and this board's
# chain invokes a behavior (`&zip_button_behaviors` → a click macro, see
# config/toucan.keymap). Zephyr defaults this stack to 512 bytes and ZMK only
# raises it to 1024 on peripherals — `default 1024 if ZMK_SPLIT &&
# !ZMK_SPLIT_ROLE_CENTRAL` in zmk/app/src/pointing/Kconfig. Whichever board is
# the central therefore keeps 512, and invoking a macro that deep faults the
# thread: 2026-08-09 the dongle's first flash froze the pointer completely on
# the first tap — cursor dead, MOUSE layer latched on, keys still alive because
# they run on a different thread.
#
# Since 2026-09-01 the central is the LEFT HALF, so this now protects the left
# build. It is repeated in boards/shields/toucan/toucan_left.conf because the
# value is tied to who the central is, and that is decided over there.
#
# This file reaches every toucan target: ZMK strips the shield suffix
# (toucan_left → toucan) when looking for config/<name>.conf, see
# zmk/app/keymap-module/modules/modules.cmake.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
