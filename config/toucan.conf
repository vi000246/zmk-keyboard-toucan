CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_ZMK_MOUSE=y
CONFIG_DONGLE_SCREEN_FLIPPED=n
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=1800
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=70
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=10
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=30
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
CONFIG_DONGLE_SCREEN_BRIGHTNESS_UP_KEYCODE=115
CONFIG_DONGLE_SCREEN_BRIGHTNESS_DOWN_KEYCODE=114
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=5

# The input thread runs the pointer's input-processor chain, and this board's
# chain invokes a behavior (`&zip_button_behaviors` → a click macro, see
# config/toucan.keymap). Zephyr defaults this stack to 512 bytes and ZMK only
# raises it to 1024 on peripherals — `default 1024 if ZMK_SPLIT &&
# !ZMK_SPLIT_ROLE_CENTRAL` in zmk/app/src/pointing/Kconfig. The dongle is the
# central, so it kept 512, and invoking a macro that deep faulted the thread:
# 2026-08-09 the first flash froze the pointer completely on the first tap —
# cursor dead, MOUSE layer latched on, keys still alive because they run on a
# different thread.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
