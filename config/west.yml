manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: albertclee
      url-base: https://github.com/alee0729
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: prospector
      url-base: https://github.com/t-ogura
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: janpfischer
      url-base: https://github.com/Dexter-KBD
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: cirque-input-module
      remote: geeksville
      revision: toucan
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    # Prospector：t-ogura 的 scanner 版，不是 carrefinho 的 dongle-display 版。
    # 兩者專案名相同（west 要求唯一），所以是「換掉」而不是「並存」。
    #
    # 鍵盤端只用它的 status advertisement：把電量 / 層名 / modifier / WPM 塞進
    # BLE 廣播對空氣喊，dongle 那邊刷 scanner 韌體被動收聽。不連線、不配對，
    # 所以不佔鍵盤的 BT profile。設定在
    # boards/shields/toucan/toucan_left.conf。
    #
    # 官方相容性標示：scanner 端需要 ZMK main，但「keyboard-side supported
    # via compatibility macros」對 ZMK 0.3 有效——我們只用鍵盤端。
    #
    # ⚠️ 為什麼是 v2.2.3 而不是 v2.0.0（2026-09-03 更正）
    #
    # 2026-09-02 曾經從 v2.2.2 降回 v2.0.0，理由寫的是「v2.2.1 起鍵盤端會註冊
    # bt_conn_cb、跑 burst/silent 廣播循環，干擾 split GATT discovery，害觸控板
    # 收不到 input」。**那個理論是錯的，已作廢。**
    #
    # 真正的原因：出問題的那台是 toucan2，硬體跟這個 repo 描述的 toucan1 不同
    # ——v1 是 Cirque Pinnacle 掛 SPI0，v2 是 Azoteq TPS43 掛 I2C0 @0x74，而且
    # P1.13 / P1.15 / P1.14 / P0.02 四根腳兩代用途完全相反（SCK/MOSI/MISO/DR
    # vs SDA/SCL/RST/RDY）。v1 韌體在 I2C 匯流排上打 SPI，感測器永遠不回話，
    # input event 恆為 0。按鍵正常是因為 kscan 那 10 根腳兩代逐字相同。
    # 換句話說：當時所有「證據」都在一台本來就不可能動的機器上取得，
    # 資訊量為零，那次降版沒有修到任何東西。
    #
    # 而降版本身有實際代價：v2.0.0 的 src/status_advertisement.c:511 無條件
    # `snprintf(layer_name, "L%d", layer)`，**根本不讀 keymap 的 display-name**，
    # 沒有任何 config 能繞過 ⇒ dongle 螢幕只能顯示 L0 / L6。v2.2.x 才改成
    # zmk_keymap_layer_name()（見 scanner-module/src/status_advertisement.c:802）。
    # 要層名就必須 ≥ v2.2.3。
    #
    # v2.0.0 / v2.2.0 / v2.2.3 的 ZMK_STATUS_ADV_VERSION 都是 1，廣播格式相同，
    # dongle 端刷哪一版的 scanner .uf2 都收得到，升這裡不用重刷 dongle。
    #
    # 注意：v2.2.x 才有 PROSPECTOR_EXPECTED_PERIPHERAL_COUNT 這個符號，
    # toucan_left.conf 對應那行已經跟著打開。
    - name: prospector-zmk-module
      remote: prospector
      revision: v2.2.3
      path: modules/prospector-zmk-module
    - name: zmk-dongle-screen
      remote: albertclee
      revision: main
    - name: zmk-auto-layer
      remote: urob
      revision: v0.3 # Should match ZMK release.
      # Upstream pinned `claude/enhance-wpm-meter-y9Hrb`, which no longer exists
      # on that fork (GitHub returns 404), so `west update` cannot resolve it.
      # `main` of the same fork is the nearest thing that does exist.
      
  self:
    path: config
