manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: albertclee
      url-base: https://github.com/alee0729
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: prospector
      url-base: https://github.com/t-ogura
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: janpfischer
      url-base: https://github.com/Dexter-KBD
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: cirque-input-module
      remote: geeksville
      revision: toucan
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    # Prospector：t-ogura 的 scanner 版，不是 carrefinho 的 dongle-display 版。
    # 兩者專案名相同（west 要求唯一），所以是「換掉」而不是「並存」。
    #
    # 鍵盤端只用它的 status advertisement：把電量 / 層名 / modifier / WPM 塞進
    # BLE 廣播對空氣喊，dongle 那邊刷 scanner 韌體被動收聽。不連線、不配對，
    # 所以不佔鍵盤的 BT profile。設定在
    # boards/shields/toucan/toucan_left.conf。
    #
    # 官方相容性標示：scanner 端需要 ZMK main，但「keyboard-side supported
    # via compatibility macros」對 ZMK 0.3 有效——我們只用鍵盤端。
    #
    # ⚠️ 釘 v2.0.0 = 原廠 beekeeb prospector-scanner 分支所用的版本（同樣是
    # 左半 central 的拓撲）。2026-09-02 曾釘 v2.2.2，結果左半收不到觸控板的
    # split input（按鍵正常、MOUSE 層不升、游標不動）：v2.2.1 起鍵盤端會註冊
    # bt_conn_cb、在 split 連線前後 bt_le_adv_start/stop、並跑 burst/silent
    # 廣播循環——它自己的註解就承認會跟 central 的 scan/connect 搶無線電
    # （CONNECT_REQ 只有 150µs 的硬體期限），嫌疑是同時也干擾了連上之後的
    # GATT discovery，讓 input characteristic 的訂閱鏈（char → CCC → CPF →
    # subscribe，見 zmk v0.3 central.c）走不完。v2.0.0 沒有這整套。
    # v2.2.3 只修 scanner 端，鍵盤端與 v2.2.2 相同，升上去沒有意義。
    #
    # v2.0.0 / v2.2.0 / v2.2.3 的 ZMK_STATUS_ADV_VERSION 都是 1，廣播格式
    # 相同，dongle 那顆刷 v2.2.0 或 v2.2.3 的 scanner .uf2 都收得到。
    #
    # 注意：v2.0.0 沒有 PROSPECTOR_EXPECTED_PERIPHERAL_COUNT 這個符號，
    # toucan_left.conf 對應那行已註解，升回 v2.2.x 時要一起打開。
    - name: prospector-zmk-module
      remote: prospector
      revision: v2.0.0
      path: modules/prospector-zmk-module
    - name: zmk-dongle-screen
      remote: albertclee
      revision: main
    - name: zmk-auto-layer
      remote: urob
      revision: v0.3 # Should match ZMK release.
      # Upstream pinned `claude/enhance-wpm-meter-y9Hrb`, which no longer exists
      # on that fork (GitHub returns 404), so `west update` cannot resolve it.
      # `main` of the same fork is the nearest thing that does exist.
      
  self:
    path: config
