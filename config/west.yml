manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: albertclee
      url-base: https://github.com/alee0729
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: prospector
      url-base: https://github.com/t-ogura
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: janpfischer
      url-base: https://github.com/Dexter-KBD
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: cirque-input-module
      remote: geeksville
      revision: toucan
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    - name: prospector-zmk-module
      remote: carrefinho
      revision: main
    - name: zmk-dongle-screen
      remote: albertclee
      revision: main
    - name: zmk-auto-layer
      remote: urob
      revision: v0.3 # Should match ZMK release.
      # Upstream pinned `claude/enhance-wpm-meter-y9Hrb`, which no longer exists
      # on that fork (GitHub returns 404), so `west update` cannot resolve it.
      # `main` of the same fork is the nearest thing that does exist.
      
  self:
    path: config
